.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

/* ---------- app shell ---------- */
.view { min-height: 100vh; padding-top: var(--safe-t); padding-bottom: calc(var(--nav-h) + var(--safe-b) + 16px); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background-color: var(--paper-deep); border-top: 1px solid var(--gold);
  padding: 6px 4px calc(8px + var(--safe-b));
}
.tabbar a {
  min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  text-decoration: none; color: var(--ink-3); font-family: var(--display); font-size: 10.5px; font-weight: 600;
}
.tabbar a[aria-current="page"] { color: var(--rust); }
.tabbar svg { width: 23px; height: 23px; }
.brand { display: none; }

/* ---------- screen parts ---------- */
.head { padding: 18px 18px 14px; background-color: var(--paper); border-bottom: 1px solid var(--line); }
.head.plain { border-bottom-color: var(--gold); }
.kicker { font-size: 14px; font-style: italic; color: var(--ink-3); }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: 0.005em; }
.sub { margin-top: 4px; font-size: 15px; color: var(--ink-2); }
.body { padding: 16px 18px 0; }
.back {
  width: 46px; height: 46px; margin: -6px 0 2px -12px; display: inline-flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--ink);
}
.back svg { width: 21px; height: 21px; }
.rule { width: 54px; height: 1px; background: var(--gold); margin: 14px 0; border: 0; }
.muted { color: var(--ink-3); font-style: italic; }
.empty { padding: 28px 4px; color: var(--ink-3); font-style: italic; text-align: center; }

.seg { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line-2); }
.seg a {
  min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none;
  color: var(--ink); font-family: var(--display); font-size: 12.5px; font-weight: 600;
}
.seg a + a { border-left: 1px solid var(--line-2); }
.seg a[aria-current="true"] { background-color: var(--rust); color: var(--paper); }

.search {
  margin-top: 12px; width: 100%; min-height: 48px; padding: 0 14px;
  background-color: var(--paper-deep); border: 1px solid var(--line-2); border-radius: 0;
  color: var(--ink); font-family: var(--body); font-size: 17px; -webkit-appearance: none; appearance: none;
}
.search::placeholder { color: var(--ink-3); }

.chips { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  min-height: 44px; padding: 0 16px; border: 1px solid var(--line-2); background-color: var(--paper-deep);
  font-family: var(--display); font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink);
}
.chip[aria-pressed="true"] { background-color: var(--rust); color: var(--paper); border-color: var(--rust); }

.link-card {
  min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; background-color: var(--paper-deep); border: 1px solid var(--line-2);
  text-decoration: none; color: var(--ink); cursor: pointer; width: 100%; text-align: left;
}
.link-card + .link-card { margin-top: 10px; }
.link-card .lc-main { display: flex; align-items: center; gap: 11px; min-width: 0; }
.link-card .lc-title { font-family: var(--display); font-size: 14.5px; font-weight: 600; }
.link-card .lc-sub { display: block; font-size: 13.5px; font-style: italic; color: var(--ink-3); }
.link-card svg { flex-shrink: 0; }
.chev { width: 17px; height: 17px; color: var(--rust); }
.ico { width: 20px; height: 20px; color: var(--rust); }

/* ---------- lists ---------- */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; gap: 14px; align-items: center; padding: 14px 0; text-decoration: none; color: var(--ink);
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row-thumb { width: 68px; height: 80px; object-fit: cover; object-position: 50% 20%; border: 1px solid var(--gold); flex-shrink: 0; background: var(--paper-deep); }
.mono {
  width: 68px; height: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold); background-color: var(--paper-deep);
  font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--rust);
}
.row-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1; }
.row-name { font-family: var(--display); font-size: 16px; font-weight: 600; line-height: 1.25; }
.row-meta { font-size: 14.5px; color: var(--ink-2); line-height: 1.3; }
.row-place { font-size: 13px; font-style: italic; color: var(--ink-3); }

.chapter-num { font-family: var(--display); font-size: 23px; font-weight: 600; color: var(--ink-3); width: 34px; flex-shrink: 0; text-align: left; }
.row.latest .chapter-num { color: var(--rust); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  background-color: var(--paper-deep); border: 1px solid var(--gold); min-width: 0;
}
.tile img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: var(--paper); }
.tile-text { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 3px; }
.tile-name { font-family: var(--display); font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.tile-meta { font-size: 13px; font-style: italic; color: var(--ink-3); }
.tile-owner { font-size: 13.5px; color: var(--ink-2); }

.pc-tile { padding: 13px 13px 14px; gap: 8px; }
.pc-tile .mono, .pc-tile img.pc-face { width: 46px; height: 46px; font-size: 19px; }
.pc-tile img.pc-face { aspect-ratio: auto; object-fit: cover; object-position: 50% 20%; border: 1px solid var(--gold); }
.pc-tile.me { border-color: var(--rust); box-shadow: inset 0 0 0 1px var(--rust); }

.shop-row {
  display: flex; align-items: center; gap: 13px; padding: 14px; text-decoration: none; color: var(--ink);
  background-color: var(--paper-deep); border: 1px solid var(--gold);
}
.shop-row + .shop-row { margin-top: 12px; }
.shop-mark {
  width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line-2); font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--rust);
}

/* ---------- detail ---------- */
.hero { position: relative; height: 58vh; max-height: 470px; min-height: 320px; overflow: hidden; background-color: var(--paper-deep); }
.hero > button.zoom-hit { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
.hero img.hero-img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.hero.contain img.hero-img { object-fit: contain; }
.hero-scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; background: linear-gradient(to top, var(--paper) 6%, rgba(240,229,200,0.86) 42%, rgba(240,229,200,0)); pointer-events: none; }
.hero-text { position: absolute; left: 18px; right: 18px; bottom: 14px; pointer-events: none; }
.hero-text h1 { font-size: 30px; font-weight: 700; }
.hero-back {
  position: absolute; top: calc(14px + var(--safe-t)); left: 14px; width: 46px; height: 46px; z-index: 2;
  display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink);
  background: rgba(240,229,200,0.92); border: 1px solid var(--line-2);
}
.hero-back svg { width: 21px; height: 21px; }
.zoom-badge {
  position: absolute; right: 14px; bottom: 14px; z-index: 2; display: flex; align-items: center; gap: 7px;
  background: rgba(27,20,10,0.78); color: var(--paper); padding: 8px 12px;
  font-family: var(--display); font-size: 11.5px; font-weight: 600; pointer-events: none;
}
.zoom-badge svg { width: 15px; height: 15px; }
.hero.has-title .zoom-badge { top: calc(14px + var(--safe-t)); bottom: auto; }

.prose { font-size: 17.5px; line-height: 1.64; }
.prose p { margin: 0 0 14px; }
.prose p:last-child { margin-bottom: 0; }
.prose a.person { text-decoration: none; border-bottom: 1px solid var(--rust); }
.star-rule { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; }
.star-rule span { height: 1px; background: var(--gold); flex-grow: 1; }

<script>
(() => {
'use strict';

/* ================= config & helpers ================= */
const DATA = document.documentElement.dataset.dataBase || 'data/';
const PREF_KEY = 'phandalin-portal-prefs';

const ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  map: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5"/><path d="M15 6.5V20"/></svg>',
  book: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5S10 4.5 4 4.5v13c6 0 8 2 8 2s2-2 8-2v-13c-6 0-8 2-8 2z"/><path d="M12 6.5v13"/></svg>',
  doc: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>',
  expand: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-7 7"/><path d="M10 20H4v-6"/><path d="M4 20l7-7"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 7.6H22l-6.2 4.5 2.4 7.6L12 17.2 5.8 21.7l2.4-7.6L2 9.6h7.6z"/></svg>',
};
const zoomBadge = `<span class="zoom-badge">${ICON.expand.replace('class="ico"', '')}Se i fuld skærm</span>`;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const norm = s => String(s || '').trim().toLowerCase();
const enc = s => encodeURIComponent(s);
const initial = name => (String(name || '?').trim()[0] || '?').toUpperCase();

function thumb(url) {
  if (!url) return '';
  const m = String(url).match(/^(.*\/data\/)images\/([^/?#]+)\.[a-z0-9]+(\?.*)?$/i);
  return m ? `${m[1]}thumbs/${m[2]}.jpg` : url;
}
/* <img> that tries the small version first and quietly falls back to the original */
function img(url, cls = '', alt = '', extra = '') {
  if (!url) return '';
  const t = thumb(url);
  const fb = t !== url ? ` data-fallback="${esc(url)}" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.removeAttribute('data-fallback')}"` : '';
  return `<img class="${cls}" src="${esc(t)}" alt="${esc(alt)}" loading="lazy" decoding="async"${fb}${extra}>`;
}

function prefs() { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; } }
function setPref(k, v) { const p = prefs(); if (v == null) delete p[k]; else p[k] = v; try { localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch (e) {} }

async function loadJSON(name) {
  try { const r = await fetch(DATA + name, { cache: 'no-cache' }); if (!r.ok) throw 0; return await r.json(); }
  catch (e) { return null; }
}

/* ================= data ================= */
const S = { labels: {}, npcs: [], players: [], items: [], sessions: [], personal: [], shops: [], map: null };
let people = [], aliasRe = null, aliasMap = new Map();
const L = (k, fb) => (S.labels[k] && String(S.labels[k]).trim()) || fb;

async function loadAll() {
  const [labels, npcs, players, items, sessions, personal, shops, map] = await Promise.all(
    ['labels.json', 'npcs.json', 'players.json', 'items.json', 'sessions.json', 'personal.json', 'shops.json', 'map.json'].map(loadJSON));
  S.labels = labels || {};
  S.npcs = (npcs && npcs.npcs) || [];
  S.players = (players && players.players) || [];
  S.items = ((items && items.items) || []).filter(i => i.visibility !== 'Skjult');
  S.sessions = ((sessions && sessions.sessions) || []).slice().sort((a, b) => (Number(a.number) || 0) - (Number(b.number) || 0));
  S.personal = ((personal && personal.personal) || []).map((p, i) => ({ ...p, _i: i }));
  S.shops = (Array.isArray(shops) ? shops : []).filter(s => s.enabled !== false);
  S.map = map && map.image ? map : null;

  people = [...S.npcs.map(p => ({ ...p, _pc: false })), ...S.players.map(p => ({ ...p, _pc: true }))];
  buildAliases();

  const title = L('site_title', 'Phandalins Krønike');
  document.title = title;
  document.getElementById('brand-kicker').textContent = L('site_kicker', '');
  document.getElementById('brand-title').textContent = title;
}

/* People can be mentioned by full name, or by a unique first name ("Tolbin"). */
function buildAliases() {
  aliasMap = new Map();
  const firstCount = new Map();
  people.forEach(p => { const f = norm(String(p.name).split(/\s+/)[0]); firstCount.set(f, (firstCount.get(f) || 0) + 1); });
  people.forEach(p => {
    if (!p.name) return;
    aliasMap.set(norm(p.name), p);
    const first = String(p.name).split(/\s+/)[0];
    if (first.length >= 4 && first !== p.name && firstCount.get(norm(first)) === 1 && !aliasMap.has(norm(first))) aliasMap.set(norm(first), p);
  });
  const keys = [...aliasMap.keys()].sort((a, b) => b.length - a.length);
  aliasRe = keys.length ? new RegExp(`(^|[^\\p{L}\\p{N}])(${keys.map(k => reEsc(esc(k))).join('|')})(?![\\p{L}\\p{N}])`, 'giu') : null;
}
function personHref(p) { return p._pc ? `#/folk/selskabet/${enc(p.name)}` : `#/folk/${enc(p.name)}`; }
function findPerson(name) { return people.find(p => norm(p.name) === norm(name)); }
function mentionsOf(p) {
  const keys = [...aliasMap.entries()].filter(([, v]) => v === p).map(([k]) => k);
  if (!keys.length) return [];
  const re = new RegExp(`(^|[^\\p{L}\\p{N}])(${keys.map(reEsc).join('|')})(?![\\p{L}\\p{N}])`, 'iu');
  return S.sessions.filter(s => re.test(s.recap || ''));
}
function sessionsMentioning(text) {
  const re = new RegExp(`(^|[^\\p{L}\\p{N}])${reEsc(text)}(?![\\p{L}\\p{N}])`, 'iu');
  return S.sessions.filter(s => re.test(s.recap || ''));
}

/* Paragraphs with the first mention of each person turned into a link. */
function prose(text, linkPeople) {
  const seen = new Set();
  return String(text || '').trim().split(/\n\s*\n/).filter(Boolean).map(par => {
    let h = esc(par);
    if (linkPeople && aliasRe) {
      h = h.replace(aliasRe, (all, pre, m) => {
        const p = aliasMap.get(norm(m.replace(/&#39;/g, "'").replace(/&amp;/g, '&')));
        if (!p || seen.has(p)) return all;
        seen.add(p);
        return `${pre}<a class="person" href="${personHref(p)}">${m}</a>`;
      });
    }
    return `<p>${h.replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

/* ================= galleries for the fullscreen viewer ================= */
const galleries = {};
function zoomAttrs(gallery, index) { return `data-zoom="${esc(gallery)}" data-zoom-i="${index}"`; }
function single(url, title, sub) {
  const key = 'one:' + url;
  galleries[key] = [{ src: url, title, sub }];
  return zoomAttrs(key, 0);
}
function buildGalleries() {
  galleries.items = S.items.filter(i => i.image).map(i => ({ src: i.image, title: i.name, sub: [i.rarity, i.owner && 'båret af ' + i.owner].filter(Boolean).join(' · '), key: i.name }));
  galleries.npcs = S.npcs.filter(n => n.image).map(n => ({ src: n.image, title: n.name, sub: n.title || '', key: n.name }));
  galleries.players = S.players.filter(n => n.image).map(n => ({ src: n.image, title: n.name, sub: n.title || '', key: n.name }));
}
const galleryIndex = (g, key) => (galleries[g] || []).findIndex(e => e.key === key);

/* ================= routing ================= */
const view = document.getElementById('view');
const scrollMemory = new Map();
let currentKey = '';

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
  return { sec: parts[0] || 'kort', a: parts[1] || '', b: parts[2] || '' };
}

function render() {
  if (currentKey) scrollMemory.set(currentKey, window.scrollY);
  const r = route();
  const key = location.hash || '#/kort';
  const screens = { kort: screenMap, logbog: screenLog, folk: screenFolk, fund: screenFund, butik: screenShops };
  const fn = screens[r.sec] || screenMap;
  view.innerHTML = fn(r);
  document.querySelectorAll('.tabbar a').forEach(a => a.setAttribute('aria-current', a.dataset.sec === (screens[r.sec] ? r.sec : 'kort') ? 'page' : 'false'));
  bindScreen(r);
  const y = scrollMemory.get(key);
  window.scrollTo(0, y || 0);
  currentKey = key;
}

/* ================= screens ================= */
function head(title, sub = '', backHref = '', plain = false) {
  return `<header class="head tex ${plain ? 'plain' : ''}">
    ${backHref ? `<a class="back" href="${backHref}" aria-label="Tilbage">${ICON.back}</a>` : ''}
    <h1>${esc(title)}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}
  </header>`;
}
function linkCard(href, icon, title, sub = '') {
  return `<a class="link-card tex" href="${href}"><span class="lc-main">${icon}<span><span class="lc-title">${esc(title)}</span>${sub ? `<span class="lc-sub">${esc(sub)}</span>` : ''}</span></span>${ICON.chev}</a>`;
}
function visiblePin(name) {
  if (!S.map || !name || !String(name).trim()) return null;
  return (S.map.pins || []).find(p => !p.hidden && norm(p.name) === norm(name)) || null;
}
function latestPlaced() {
  const s = [...S.sessions].reverse().find(x => x.mapPin && String(x.mapPin).trim());
  return s && visiblePin(s.mapPin) ? s : null;
}

/* ---------- Kort ---------- */
function screenMap(r) {
  const title = L('site_title', 'Phandalins Krønike');
  const kicker = L('site_kicker', '');
  if (!S.map) return `<header class="head tex"><div class="kicker">${esc(kicker)}</div><h1>${esc(title)}</h1></header><p class="empty">Kortet er ikke lagt op endnu.</p>`;
  const now = latestPlaced();
  const selected = visiblePin(r.a) ? r.a : '';
  const pins = (S.map.pins || []).filter(p => !p.hidden);
  const pinsHTML = pins.map(p => {
    const isHere = now && norm(now.mapPin) === norm(p.name);
    const on = norm(selected) === norm(p.name);
    return `<button type="button" class="pin ${isHere ? 'here' : ''}" data-pin="${esc(p.name)}" aria-pressed="${on}" style="left:${Number(p.x)}%;top:${Number(p.y)}%">
      <span class="pin-label">${esc(p.name)}</span><span class="pin-dot"></span></button>`;
  }).join('');
  const nowHTML = now ? `<div class="now-card tex">
      <div class="label"><span>Hvor vi er nu</span><i>Kapitel ${esc(now.number)}</i></div>
      <div class="place">${esc(now.mapPin)}</div>
      ${linkCard(`#/logbog/${enc(now.number)}`, ICON.book, now.title, 'Seneste optegnelse')}
    </div>` : '';
  return `<header class="head tex"><div class="kicker">${esc(kicker)}</div><h1>${esc(title)}</h1></header>
    <div class="map-layout">
      <div>
        <div class="map-stage">${img(S.map.image, '', L('map', 'Kort'))}${pinsHTML}</div>
        <div class="map-tools"><button type="button" class="link-card tex" ${single(S.map.image, L('map', 'Kort'), 'Kortet i fuld opløsning')}><span class="lc-main">${ICON.expand}<span class="lc-title">Åbn kortet i fuld skærm</span></span>${ICON.chev}</button></div>
      </div>
      <div class="map-side">
        ${selected ? pinDetail(selected) : nowHTML + `<p class="muted" style="padding:14px 18px 0;margin:0">Tryk på et sted på kortet for at se, hvem og hvad der hører til der.</p>`}
      </div>
    </div>`;
}
function pinDetail(name) {
  const here = people.filter(p => norm(p.mapPin) === norm(name));
  const shops = S.shops.filter(s => norm(s.mapPin) === norm(name));
  const sess = S.sessions.filter(s => norm(s.mapPin) === norm(name));
  let h = `<div class="pin-detail"><h2 id="pin-h" tabindex="-1">${esc(name)}</h2><a href="#/kort" class="muted" style="font-size:15px">Luk stedet</a>`;
  if (!here.length && !shops.length && !sess.length) return h + `<p class="muted">Intet tilknyttet ${esc(name)} endnu.</p></div>`;
  if (here.length) h += `<div class="section-h">Folk her</div><div class="rows">${here.map(personRow).join('')}</div>`;
  if (shops.length) h += `<div class="section-h">Butikker her</div>${shops.map(s => linkCard(`#/butik/${enc(s.id)}`, ICON.doc, s.name, s.keeper || '')).join('')}`;
  if (sess.length) h += `<div class="section-h">Optegnelser herfra</div>${sess.map(s => linkCard(`#/logbog/${enc(s.number)}`, ICON.book, s.title, 'Kapitel ' + s.number)).join('')}`;
  return h + '</div>';
}

/* ---------- Logbog ---------- */
function screenLog(r) {
  if (r.a) return sessionDetail(r.a);
  if (!S.sessions.length) return head(L('sessions', 'Logbog')) + '<p class="empty">Ingen optegnelser endnu.</p>';
  const list = [...S.sessions].reverse();
  const latestNo = list[0] && list[0].number;
  return head(L('sessions', 'Logbog'), `${S.sessions.length} optegnelser`) + `<div class="body"><div class="rows">${list.map(s => `
    <a class="row ${s.number === latestNo ? 'latest' : ''}" href="#/logbog/${enc(s.number)}">
      <span class="chapter-num">${esc(s.number)}</span>
      <span class="row-text"><span class="row-name">${esc(s.title)}</span>
        <span class="row-place">${[s.number === latestNo ? 'Seneste' : '', s.date, s.audio ? 'med lydoptagelse' : ''].filter(Boolean).map(esc).join(' · ')}</span></span>
      ${ICON.chev}</a>`).join('')}</div></div>`;
}
function sessionDetail(no) {
  const i = S.sessions.findIndex(s => String(s.number) === String(no));
  const s = S.sessions[i];
  if (!s) return head('Ukendt optegnelse', '', '#/logbog') + '<p class="empty">Den optegnelse findes ikke.</p>';
  const prev = S.sessions[i - 1], next = S.sessions[i + 1];
  const audio = !s.audio ? '' : /\.(mp3|wav|ogg|m4a|aac|flac|opus)(\?.*)?$/i.test(s.audio)
    ? `<audio controls preload="none" src="${esc(s.audio)}"></audio>`
    : `<a class="link-card tex audio-card" href="${esc(s.audio)}" target="_blank" rel="noopener"><span class="lc-main"><span class="play">${ICON.play}</span><span><span class="lc-title">Lyt til afsnittet</span><span class="lc-sub">Åbner optagelsen i et nyt vindue</span></span></span>${ICON.chev}</a>`;
  return `<header class="head tex"><a class="back" href="#/logbog" aria-label="Tilbage til logbogen">${ICON.back}</a>
      <div class="kicker">Kapitel ${esc(s.number)}${s.date ? ' · ' + esc(s.date) : ''}</div><h1>${esc(s.title)}</h1></header>
    <div class="body reading">
      <div class="star-rule"><span></span>${ICON.star}<span></span></div>
      ${s.image ? `<button type="button" class="inline-img" ${single(s.image, s.title, 'Kapitel ' + s.number)} aria-label="Se billedet i fuld skærm">${img(s.image)}</button>` : ''}
      <div class="prose">${prose(s.recap, true) || '<p class="muted">Ingen tekst endnu.</p>'}</div>
      ${audio}
      ${visiblePin(s.mapPin) ? `<div style="margin-top:12px">${linkCard(`#/kort/${enc(s.mapPin)}`, ICON.map, `Se ${s.mapPin} på kortet`)}</div>` : ''}
      <nav class="pager" aria-label="Andre kapitler">
        ${prev ? `<a href="#/logbog/${enc(prev.number)}">${ICON.back}Kapitel ${esc(prev.number)}</a>` : '<span></span>'}
        ${next ? `<a href="#/logbog/${enc(next.number)}">Kapitel ${esc(next.number)}${ICON.chev.replace('class="chev"', '')}</a>` : '<span></span>'}
      </nav>
    </div>`;
}

/* ---------- Folk ---------- */
function personRow(p) {
  const face = p.image ? img(p.image, 'row-thumb') : `<span class="mono" aria-hidden="true">${esc(initial(p.name))}</span>`;
  return `<a class="row" href="${personHref(p)}" data-search="${esc(norm([p.name, p.title, p.location].join(' ')))}">${face}

      ${p.title ? `<span class="row-meta">${esc(p.title)}</span>` : ''}
      ${p.location ? `<span class="row-place">${esc(p.location)}</span>` : ''}</span></a>`;
}
function folkHead(active) {
  return `<header class="head tex"><h1>Folk</h1>
    <div class="seg" role="tablist">
      <a href="#/folk" aria-current="${active === 'npc'}">${esc(L('npcs', 'Folk vi har mødt'))}</a>
      <a href="#/folk/selskabet" aria-current="${active === 'pc'}">${esc(L('players', 'Selskabet'))}</a>
    </div>
    ${active === 'npc' ? `<label class="sr" for="folk-search">Søg efter en person</label><input id="folk-search" class="search tex" type="search" placeholder="Søg efter navn, titel eller sted" autocomplete="off">` : ''}
  </header>`;
}
function screenFolk(r) {
  if (r.a === 'selskabet') return r.b ? pcDetail(r.b) : partyScreen();
  if (r.a) return npcDetail(r.a);
  if (!S.npcs.length) return folkHead('npc') + '<p class="empty">Ingen personer lagt op endnu.</p>';

    <p class="empty" id="folk-none" hidden>Ingen matcher søgningen.</p></div>`;
}
function detailHero(p, gallery, back) {
  const gi = galleryIndex(gallery, p.name);
  const title = `<div class="hero-text">${p.location ? `<div class="kicker">${esc(p.location)}</div>` : ''}<h1>${esc(p.name)}</h1>${p.title ? `<div class="sub" style="font-size:16px">${esc(p.title)}</div>` : ''}</div>`;
  if (!p.image) {
    return `<header class="head tex"><a class="back" href="${back}" aria-label="Tilbage">${ICON.back}</a>
      ${p.location ? `<div class="kicker">${esc(p.location)}</div>` : ''}<h1>${esc(p.name)}</h1>${p.title ? `<div class="sub">${esc(p.title)}</div>` : ''}</header>`;
  }
  return `<div class="hero has-title">
      <button type="button" class="zoom-hit" ${zoomAttrs(gallery, gi)} aria-label="Se portrættet af ${esc(p.name)} i fuld skærm">${img(p.image, 'hero-img', 'Portræt af ' + p.name)}</button>
      <div class="hero-scrim"></div>${title}

function deskTitle(p) {
  return `<div class="desk-title" style="margin-top:6px">${p.location ? `<div class="kicker">${esc(p.location)}</div>` : ''}<h1>${esc(p.name)}</h1>${p.title ? `<div class="sub">${esc(p.title)}</div>` : ''}</div>`;
}
function npcDetail(name) {
  const p = findPerson(name);
  if (!p || p._pc) return head('Ukendt person', '', '#/folk') + '<p class="empty">Personen findes ikke i krøniken.</p>';

      <div style="margin-top:20px">
        ${visiblePin(p.mapPin) ? linkCard(`#/kort/${enc(p.mapPin)}`, ICON.map, `Vis ${p.mapPin} på kortet`) : ''}
        ${ment.length ? `<div class="section-h">Nævnt i ${ment.length === 1 ? 'én optegnelse' : ment.length + ' optegnelser'}</div>${ment.map(s => linkCard(`#/logbog/${enc(s.number)}`, ICON.book, s.title, 'Kapitel ' + s.number)).join('')}` : ''}
      </div>
    </div></div>`;
}
function partyScreen() {
  const me = prefs().me;
  const mine = me && findPerson(me);
  const tiles = S.players.map(p => `
    <a class="tile tex pc-tile ${mine && mine.name === p.name ? 'me' : ''}" href="#/folk/selskabet/${enc(p.name)}">

  return folkHead('pc') + `<div class="body">
    ${mine && mine._pc ? `<div style="margin-bottom:16px">${linkCard(`#/folk/selskabet/${enc(mine.name)}`, ICON.doc, 'Mine papirer', mine.name)}</div>` : ''}
    ${S.players.length ? `<div class="grid2">${tiles}</div>` : '<p class="empty">Ingen karakterer lagt op endnu.</p>'}
    ${!mine && S.players.length ? `<p class="muted" style="margin-top:16px;font-size:15px">Åbn din egen karakter og vælg "Det er min karakter", så ligger dine papirer lige her næste gang.</p>` : ''}
  </div>`;
}
const revealed = new Set();
function paperCard(p) {
  const body = `${p.date ? `<div class="paper-kind">${esc(p.date)}</div>` : ''}
    ${p.content ? `<div class="prose">${prose(p.content, false)}</div>` : ''}
    ${p.image ? `<button type="button" class="inline-img" ${single(p.image, p.title, p.kind)} aria-label="Se billedet i fuld skærm">${img(p.image)}</button>` : ''}
    ${p.pdf ? `<a class="link-card tex" href="${esc(p.pdf)}" target="_blank" rel="noopener"><span class="lc-main">${ICON.doc}<span class="lc-title">Åbn dokumentet</span></span>${ICON.chev}</a>` : ''}`;
  if (p.kind === 'Note/Brev') {
    return `<div class="paper-card tex"><div class="paper-kind">Note eller brev</div><div class="paper-title">${esc(p.title)}</div>${body}</div>`;
  }
  if (!revealed.has(p._i)) {
    return `<button type="button" class="paper-card tex secret" data-reveal="${p._i}" aria-expanded="false">
      <div class="paper-kind">${esc(p.kind)}</div><div class="paper-title">${esc(p.title)}</div>
      <div class="reveal">${ICON.eye}Tryk for at afsløre</div></button>`;
  }
  return `<div class="paper-card tex" style="border-color:var(--rust)"><div class="paper-kind">${esc(p.kind)}</div><div class="paper-title">${esc(p.title)}</div>${body}
    <button type="button" class="hide-again" data-reveal="${p._i}" aria-expanded="true">Skjul igen</button></div>`;
}
function pcDetail(name) {
  const p = findPerson(name);
  if (!p || !p._pc) return head('Ukendt karakter', '', '#/folk/selskabet') + '<p class="empty">Karakteren findes ikke.</p>';
  const isMe = norm(prefs().me) === norm(p.name);
  const items = S.items.filter(i => norm(i.owner) === norm(p.name));
  const mine = S.personal.filter(x => norm(x.character) === norm(p.name));
  const notes = mine.filter(x => x.kind === 'Note/Brev');
  const secrets = mine.filter(x => x.kind !== 'Note/Brev');
  return `<div class="detail-wrap">${detailHero(p, 'players', '#/folk/selskabet')}
    <div class="body reading">${p.image ? deskTitle(p) : ''}
      <hr class="rule">
      <div class="prose">${prose(p.description, false)}</div>
      <button type="button" class="me-toggle tex" id="me-toggle" aria-pressed="${isMe}">${isMe ? 'Min karakter' : 'Det er min karakter'}</button>
      ${items.length ? `<div class="section-h">Genstande</div><div class="grid2">${items.map(itemTile).join('')}</div>` : ''}
      ${notes.length ? `<div class="section-h">Noter og breve</div>${notes.map(paperCard).join('')}` : ''}
      ${secrets.length ? `<div class="section-h">Hemmelige beskeder</div>${secrets.map(paperCard).join('')}` : ''}
      ${!items.length && !mine.length ? `<p class="muted" style="margin-top:18px">Intet registreret endnu for ${esc(p.name)}.</p>` : ''}
    </div></div>`;
}

function shopDetail(id) {
  const s = S.shops.find(x => String(x.id) === String(id));

      return `<div class="stock ${sold ? 'sold' : ''}"><div class="stock-main"><div class="stock-name">${esc(it.name)}</div>

          <span class="qty tex ${!sold && q <= 2 ? 'low' : ''}">${sold ? 'Udsolgt' : isNaN(q) ? 'På lager' : q + ' på lager'}</span></div></div>`;
    }).join('') : '<p class="empty">Hylderne er tomme.</p>'}
    ${visiblePin(s.mapPin) ? `<div style="margin-top:18px">${linkCard(`#/kort/${enc(s.mapPin)}`, ICON.map, `Se ${s.mapPin} på kortet`)}</div>` : ''}</div>`;
}

/* Keep pin labels inside the map and off each other: nudge at the edges, flip below the dot on collision. */
function layoutPins() {
  const stage = view.querySelector('.map-stage');
  if (!stage) return;
  const sr = stage.getBoundingClientRect();
  const pins = [...stage.querySelectorAll('.pin')];
  pins.forEach(p => { p.classList.remove('below'); p.querySelector('.pin-label').style.transform = ''; });
  const ordered = pins.slice().sort((a, b) => (b.classList.contains('here') || b.getAttribute('aria-pressed') === 'true') - (a.classList.contains('here') || a.getAttribute('aria-pressed') === 'true'));
  const placed = [];
  const hit = (r) => placed.some(q => !(r.right + 3 < q.left || r.left - 3 > q.right || r.bottom + 2 < q.top || r.top - 2 > q.bottom));
  const fit = (lab) => {
    lab.style.transform = '';
    const r = lab.getBoundingClientRect();
    let dx = 0;
    if (r.left < sr.left + 4) dx = sr.left + 4 - r.left;
    else if (r.right > sr.right - 4) dx = sr.right - 4 - r.right;
    if (dx) lab.style.transform = `translateX(calc(-50% + ${dx}px))`;
    return lab.getBoundingClientRect();
  };
  ordered.forEach(p => {
    const lab = p.querySelector('.pin-label');
    let r = fit(lab);
    if (hit(r)) { p.classList.add('below'); const r2 = fit(lab); if (!hit(r2)) r = r2; else { p.classList.remove('below'); r = fit(lab); } }
    placed.push(r);
  });
}
let pinTimer = 0;
window.addEventListener('resize', () => { clearTimeout(pinTimer); pinTimer = setTimeout(layoutPins, 120); });

/* ================= per-screen behaviour ================= */
function bindScreen(r) {
  const mapImg = view.querySelector('.map-stage > img');
  if (mapImg) { if (mapImg.complete) layoutPins(); else mapImg.addEventListener('load', layoutPins, { once: true }); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutPins);
  const search = document.getElementById('folk-search');
  if (search) {
    const q = sessionStorageGet('folk-q') || '';
    search.value = q;
    const apply = () => {
      const v = norm(search.value);
      sessionStorageSet('folk-q', search.value);
      let shown = 0;
      document.querySelectorAll('#folk-list .row').forEach(el => { const ok = !v || el.dataset.search.includes(v); el.hidden = !ok; if (ok) shown++; });
      document.getElementById('folk-none').hidden = shown > 0;
    };
    search.addEventListener('input', apply);
    apply();
  }
  view.querySelectorAll('[data-pin]').forEach(el => el.addEventListener('click', () => {
    const name = el.dataset.pin;
    const target = norm(route().a) === norm(name) ? '#/kort' : '#/kort/' + enc(name);
    history.replaceState(null, '', target);
    scrollMemory.delete(target);
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    const h = document.getElementById('pin-h');
    if (h && window.matchMedia('(max-width: 999px)').matches) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  view.querySelectorAll('[data-reveal]').forEach(el => el.addEventListener('click', () => {
    const i = Number(el.dataset.reveal);
    revealed.has(i) ? revealed.delete(i) : revealed.add(i);
    const y = window.scrollY; view.innerHTML = screenFolk(route()); bindScreen(route()); window.scrollTo(0, y);
  }));
  const meBtn = document.getElementById('me-toggle');
  if (meBtn) meBtn.addEventListener('click', () => {
    const name = route().b;
    const isMe = norm(prefs().me) === norm(name);
    setPref('me', isMe ? null : (findPerson(name) || {}).name);
    meBtn.setAttribute('aria-pressed', String(!isMe));
    meBtn.textContent = !isMe ? 'Min karakter' : 'Det er min karakter';
  });
  view.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('click', () => {
    sessionStorageSet('fund-filter', el.dataset.filter);
    render();
  }));
}

/* ================= fullscreen viewer ================= */
const V = {
  el: document.getElementById('viewer'), stage: document.getElementById('v-stage'), img: document.getElementById('v-img'),
  pct: document.getElementById('v-pct'), hint: document.getElementById('v-hint'), load: document.getElementById('v-load'),
  list: [], i: 0, s: 1, x: 0, y: 0, ptrs: new Map(), g: null, lastTap: 0, opener: null, hinted: false,
};
const MAX = 6;
function vApply(animate) {
  V.img.style.transition = animate ? 'transform 0.22s ease-out' : 'none';
  V.img.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
  V.pct.textContent = Math.round(V.s * 100) + ' %';
}
function vClamp() {
  V.s = Math.min(MAX, Math.max(1, V.s));
  const r = V.stage.getBoundingClientRect();
  const w = V.img.offsetWidth * V.s, h = V.img.offsetHeight * V.s;
  const mx = Math.max(0, (w - r.width) / 2), my = Math.max(0, (h - r.height) / 2);
  V.x = Math.min(mx, Math.max(-mx, V.x));
  V.y = Math.min(my, Math.max(-my, V.y));
}
/* zoom to scale s1 keeping the screen point (px,py) — relative to stage centre — fixed */
function vZoomAt(s1, px, py) {
  s1 = Math.min(MAX, Math.max(1, s1));
  const k = s1 / V.s;
  V.x = px - (px - V.x) * k; V.y = py - (py - V.y) * k; V.s = s1;
  vClamp();
}
function vRel(e) { const r = V.stage.getBoundingClientRect(); return [e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2]; }
function vReset(animate) { V.s = 1; V.x = 0; V.y = 0; vApply(animate); }
function vShow() {
  const e = V.list[V.i];
  vReset(false);
  V.load.hidden = false;
  V.img.style.opacity = '0';
  V.img.onload = () => { V.load.hidden = true; V.img.style.opacity = '1'; };
  V.img.onerror = () => { V.load.textContent = 'Billedet kunne ikke hentes.'; };
  V.img.src = e.src;
  V.img.alt = e.title || '';
  document.getElementById('v-title').textContent = e.title || '';
  document.getElementById('v-sub').textContent = e.sub || '';
  const many = V.list.length > 1;
  document.getElementById('v-prev').hidden = !many;
  document.getElementById('v-next').hidden = !many;
  document.getElementById('v-prev').disabled = V.i === 0;
  document.getElementById('v-next').disabled = V.i === V.list.length - 1;
}
function vOpen(list, i, opener) {
  if (!list || !list.length) return;
  V.list = list; V.i = Math.max(0, Math.min(i, list.length - 1)); V.opener = opener;
  V.load.textContent = 'Henter billedet…';
  V.el.hidden = false;
  document.body.style.overflow = 'hidden';
  history.pushState({ viewer: true }, '', location.href);
  vShow();
  V.hint.classList.toggle('gone', V.hinted);
  if (!V.hinted) { V.hinted = true; setTimeout(() => V.hint.classList.add('gone'), 2600); }
  document.getElementById('v-close').focus();
}
function vHide() {
  V.el.hidden = true;
  document.body.style.overflow = '';
  V.img.removeAttribute('src');
  V.ptrs.clear();
  if (V.opener && document.contains(V.opener)) V.opener.focus({ preventScroll: true });
}
function vClose() { if (history.state && history.state.viewer) history.back(); else vHide(); }
function vGo(d) { const n = V.i + d; if (n < 0 || n >= V.list.length) return; V.i = n; vShow(); }

window.addEventListener('popstate', () => { if (!V.el.hidden) vHide(); });
document.getElementById('v-close').addEventListener('click', vClose);
document.getElementById('v-fit').addEventListener('click', () => vReset(true));
document.getElementById('v-prev').addEventListener('click', () => vGo(-1));
document.getElementById('v-next').addEventListener('click', () => vGo(1));
document.addEventListener('keydown', e => {
  if (V.el.hidden) return;
  if (e.key === 'Escape') vClose();
  else if (e.key === 'ArrowLeft') vGo(-1);
  else if (e.key === 'ArrowRight') vGo(1);
  else if (e.key === '+' || e.key === '=') { vZoomAt(V.s * 1.4, 0, 0); vApply(true); }
  else if (e.key === '-') { vZoomAt(V.s / 1.4, 0, 0); vApply(true); }
});
V.stage.addEventListener('wheel', e => {
  e.preventDefault();
  const [px, py] = vRel(e);
  vZoomAt(V.s * Math.exp(-e.deltaY * 0.0022), px, py);
  vApply(false);
}, { passive: false });
V.stage.addEventListener('pointerdown', e => {
  V.stage.setPointerCapture(e.pointerId);
  V.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: Date.now() });
  const p = [...V.ptrs.values()];
  if (p.length === 2) {
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    const mid = vRel({ clientX: (p[0].x + p[1].x) / 2, clientY: (p[0].y + p[1].y) / 2 });
    V.g = { type: 'pinch', d0: d || 1, s0: V.s, x0: V.x, y0: V.y, m0: mid };
  } else if (p.length === 1) {
    V.g = { type: 'pan', x0: V.x, y0: V.y, cx: e.clientX, cy: e.clientY };
  }
});
V.stage.addEventListener('pointermove', e => {
  const pt = V.ptrs.get(e.pointerId);
  if (!pt || !V.g) return;
  pt.x = e.clientX; pt.y = e.clientY;
  const p = [...V.ptrs.values()];
  if (V.g.type === 'pinch' && p.length >= 2) {
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    const m = vRel({ clientX: (p[0].x + p[1].x) / 2, clientY: (p[0].y + p[1].y) / 2 });
    const s1 = Math.min(MAX, Math.max(1, V.g.s0 * d / V.g.d0));
    const k = s1 / V.g.s0;
    V.s = s1;
    V.x = m[0] - (V.g.m0[0] - V.g.x0) * k;
    V.y = m[1] - (V.g.m0[1] - V.g.y0) * k;
    vClamp(); vApply(false);
  } else if (V.g.type === 'pan' && V.s > 1) {
    V.x = V.g.x0 + (e.clientX - V.g.cx);
    V.y = V.g.y0 + (e.clientY - V.g.cy);
    vClamp(); vApply(false);
  }
});
function vUp(e) {
  const pt = V.ptrs.get(e.pointerId);
  V.ptrs.delete(e.pointerId);
  if (!pt) return;
  const dx = e.clientX - pt.x0, dy = e.clientY - pt.y0, dt = Date.now() - pt.t0;
  if (V.ptrs.size === 1) {
    const [o] = V.ptrs.values();
    V.g = { type: 'pan', x0: V.x, y0: V.y, cx: o.x, cy: o.y };
    return;
  }
  const wasPinch = V.g && V.g.type === 'pinch';
  V.g = null;
  if (wasPinch) return;
  if (V.s === 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 600) { vGo(dx < 0 ? 1 : -1); return; }
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 300) {
    const now = Date.now();
    if (now - V.lastTap < 320) {
      V.lastTap = 0;
      if (V.s > 1) vReset(true);
      else { const [px, py] = vRel(e); vZoomAt(2.5, px, py); vApply(true); }
    } else V.lastTap = now;
  }
}
V.stage.addEventListener('pointerup', vUp);
V.stage.addEventListener('pointercancel', vUp);
window.addEventListener('resize', () => { if (!V.el.hidden) { vClamp(); vApply(false); } });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-zoom]');
  if (!t) return;
  e.preventDefault();
  vOpen(galleries[t.dataset.zoom], Number(t.dataset.zoomI) || 0, t);
});

/* ================= start ================= */
window.addEventListener('hashchange', render);
loadAll().then(() => { buildGalleries(); render(); }).catch(() => {
  view.innerHTML = '<p class="empty">Krøniken kunne ikke hentes. Prøv at genindlæse siden.</p>';
});
})();
</script>
